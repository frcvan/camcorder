[package]
name = "camcorder"
version = "0.1.0"
edition = "2021"
description = "Pull FRC match stats and match video from The Blue Alliance, then split each video into its individual camera views."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
